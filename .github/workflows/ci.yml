name: synthetic-tests

# Runs tests on fabricated data only. This workflow never downloads a dataset.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: P0 synthetic tests
        run: python -I tests/p0_smoke_tests.py
      - name: P1 synthetic tests
        run: python -I tests/p1_smoke_tests.py
      - name: Command-line synthetic tests
        run: python -I tests/cli_smoke_tests.py
